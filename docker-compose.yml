version: '3.8'

services:
  mongo:
    image: mongo:6-alpine
    container_name: zyvenormc-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: zyvenormc

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zyvenormc-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/zyvenormc
      - JWT_SECRET=change_this_to_a_secure_random_string_in_production
      - BCRYPT_SALT_ROUNDS=10
      - CORS_ORIGIN=http://localhost:8080
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zyvenormc-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000

volumes:
  mongo-data:
